[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fm4-content-converter"
version = "0.1.0.dev0"
description = "Vehicle content conversion and offline audits targeting Forza Motorsport 4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
full = [
    "numpy==2.3.5",
    "Pillow==12.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
